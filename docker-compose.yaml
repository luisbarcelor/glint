services:
  glint-api:
    build:
      context: ./backend
      dockerfile: Glint.HttpApi/Dockerfile
      target: development
    container_name: glint-api-dev
    ports:
      - "5000:5000"
    environment:
      - Redis__ConnectionString=redis:6379,password=${REDIS_PASSWORD}
    depends_on:
      - redis
    networks:
      - glint-network

  redis:
    image: redis:8.4.0-alpine
    container_name: glint-redis-dev
    ports:
      - "6379:6379"
    volumes:
      - glint_redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD}
    networks:
      - glint-network

networks:
  glint-network:
    driver: bridge

volumes:
  glint_redis_data:
